name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:content
      # Design spec 2.5: every shipped puzzle is legal and has one answer.
      #
      # Cached on the CONTENT of the puzzle packs, because the packs are static
      # and the check is expensive: it was 398s of a 612s deploy -- 65% of every
      # release spent re-proving 7,909 puzzles that had not changed since the
      # last release.
      #
      # The key is a hash of the packs themselves, so it is the DATA that
      # decides, not a branch name or a date. Edit a pack and the key changes,
      # the cache misses, and the full check runs. There is no path on which a
      # changed puzzle ships unverified, which is the only property this
      # optimisation is allowed to cost nothing on.
      #
      # The marker is written only after the check passes, so a failed run
      # leaves no cache and the next run repeats the work rather than
      # inheriting a pass it never earned.
      - name: Puzzle verification cache
        id: puzzle-cache
        uses: actions/cache@v4
        with:
          path: .puzzles-verified
          key: puzzles-${{ hashFiles('public/data/puzzles/**', 'scripts/verify-puzzles.mjs') }}
      - name: Verify puzzles
        if: steps.puzzle-cache.outputs.cache-hit != 'true'
        run: |
          npm run verify:puzzles
          echo "verified ${{ hashFiles('public/data/puzzles/**', 'scripts/verify-puzzles.mjs') }}" > .puzzles-verified
      - name: Puzzle verification (cached)
        if: steps.puzzle-cache.outputs.cache-hit == 'true'
        run: |
          echo "Puzzle packs unchanged since the last verified run; skipping."
          cat .puzzles-verified
      # The e2e gate runs against a production bundle, not the dev server.
      # It is built at the root base so the specs can navigate with relative
      # paths; the Pages build below keeps the /chessapp/ base.
      - name: Build for the e2e preview
        run: npx vite build --base=/ --outDir dist-e2e
      - run: npx playwright install chromium --with-deps
      - name: End-to-end tests
        run: npx playwright test tests/e2e
        env:
          PREVIEW: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # PRD 11's 300 KiB shell budget was enforced by nobody: the script
      # existed and ran in no workflow. It must run HERE, on the build that
      # ships, and not on a separate build of its own — the Supabase client
      # compiles in only when the secrets above are present, and it is worth
      # ~50 KiB gzipped. A build without them measures 249 KiB and passes
      # comfortably while the deployed build sits at 299.9 against a 300 limit.
      # The script exits 1 when over, so this step is the gate.
      - name: Shell size budget (PRD 11)
        run: node scripts/measure-shell-size.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
