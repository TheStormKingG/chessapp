name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The secret is checked before anything expensive runs, and the job fails
      # rather than passing quietly. A required check that silently succeeds
      # when the reviewer never ran is worse than no check at all.
      - name: Require the ANTHROPIC_API_KEY secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not available to this run."
            echo "Add it at Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Note: pull_request runs from a fork never receive repository secrets;"
            echo "this workflow can only review branches pushed to this repository."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The merge-base diff needs both sides of the history.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The diff is computed here, and the file count is passed separately so
      # the reviewer can assert it saw the changes it claims to have reviewed.
      - name: Collect the diff
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # checkout above fetched the full history, so both SHAs are present.
          # No `|| true` anywhere here: a failure to compute the diff must fail
          # the job, not fall through to a clean review of nothing.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Diffing $merge_base..$HEAD_SHA"
          git diff --unified=5 --no-color "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          changed=$(git diff --name-only "$merge_base" "$HEAD_SHA" | wc -l | tr -d ' ')
          echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed files: $changed"

      - name: Review the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Opus, deliberately. This reviewer is prompted for defect classes
          # that need reading rather than pattern-matching — a test that
          # cannot fail, an instrument reporting on itself, state surviving
          # between items — and the weaker model catches materially fewer of
          # them. A review that misses the finding is not cheaper, it is only
          # quieter.
          #
          # The cost driver is how OFTEN this runs, not how large the diff is:
          # once per PR open and once per push to a PR branch. If that becomes
          # the problem, the lever is the trigger, not the model — drop
          # `synchronize` so it reviews on open and on demand rather than on
          # every push. Set this to claude-sonnet-5 to trade depth for spend.
          ANTHROPIC_MODEL: claude-opus-5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFF_FILE: ${{ runner.temp }}/pr.diff
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
        run: node scripts/ai-review.mjs
